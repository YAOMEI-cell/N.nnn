<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岁岁晚安</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:url("./cover.JPG") center center no-repeat;
  background-size:cover;
  background-attachment:fixed;
  min-height:100vh;
  font-family:"PingFang SC",system-ui,sans-serif;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:80px;
  padding-left:20px;
  padding-right:20px;
}
.dark-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.54);
  z-index:0;
}
audio{
  width:100%;
  max-width:440px;
  z-index:2;
  position:relative;
  margin-bottom:40px;
}
.lyric-container{
  width:100%;
  max-width:440px;
  height:460px;
  overflow:hidden;
  position:relative;
  z-index:2;
}
.lyric-scroll{
  transition:transform 0.5s ease-out;
}
.lyric-line{
  text-align:center;
  padding:18px 12px;
  font-size:18px;
  line-height:1.75;
  color:#cccccc;
}
.lyric-line.active{
  color:#ffffff;
  font-size:21px;
  font-weight:500;
}
</style>
</head>
<body>
<div class="dark-mask"></div>
<audio id="player" controls src="./song.m4a">

<div class="lyric-container">
<div class="lyric-scroll" id="scrollBox">
<div class="lyric-line" data-t="0"></div>
<div class="lyric-line" data-t="6.18">一晃走过整整三年时间段</div>
<div class="lyric-line" data-t="9.57">爱意从没掉进平淡的港湾</div>
<div class="lyric-line" data-t="13.04">你惯着我孩子气所有小野蛮</div>
<div class="lyric-line" data-t="16.47">包容软肋把我细心看管</div>
<div class="lyric-line" data-t="19.93">命中敲定我们专属的羁绊</div>
<div class="lyric-line" data-t="23.36">你中有我揉碎在三餐与晚安</div>
<div class="lyric-line" data-t="26.89">黄金八月做彼此贴身挂件</div>
<div class="lyric-line" data-t="30.31">每日温存与晚风漫漫</div>
<div class="lyric-line" data-t="33.78">回家归途不忘榴莲搭配车厘子</div>
<div class="lyric-line" data-t="37.21">揣着我偏爱奔赴我的心尖</div>
<div class="lyric-line" data-t="40.74">晨起出门定格亲吻相拥片段</div>
<div class="lyric-line" data-t="44.17">深夜小酌碰杯熬到凌晨时段</div>
<div class="lyric-line" data-t="47.64">醉后依偎相拥等到天光漫上岸</div>
<div class="lyric-line" data-t="51.06">三年晚安循环从未间断</div>
<div class="lyric-line" data-t="54.59">拌嘴不过在乎催生的小牵绊</div>
<div class="lyric-line" data-t="58.02">一眼释怀拥抱抹平所有不安</div>
<div class="lyric-line" data-t="61.55">事事有回应 件件都有着落</div>
<div class="lyric-line" data-t="64.98">你的偏爱日复一日不曾褪色</div>
<div class="lyric-line" data-t="68.45">朝夕缠绕不分你我的轮廓</div>
<div class="lyric-line" data-t="71.88">三年热恋依旧鲜活炙热</div>
<div class="lyric-line" data-t="75.41">八月相伴贴身挂在你身侧</div>
<div class="lyric-line" data-t="78.84">美酒长夜相拥熬过漫漫夜色</div>
<div class="lyric-line" data-t="82.31">晨起吻别 睡前问候定格</div>
<div class="lyric-line" data-t="85.74">命中注定只和你度过</div>
<div class="lyric-line" data-t="89.27">琐碎日常你牢牢记下我的偏爱</div>
</div>
</div>

<script>
const player = document.getElementById("player");
const scrollBox = document.getElementById("scrollBox");
const allLines = Array.from(document.querySelectorAll(".lyric-line"));
let nowIndex = -1;

player.addEventListener("timeupdate",function(){
  const t = player.currentTime;
  let targetIndex = 0;
  for(let i=0;i<allLines.length;i++){
    const lt = parseFloat(allLines[i].dataset.t);
    if(t >= lt){
      targetIndex = i;
    }
  }
  if(targetIndex === nowIndex) return;
  nowIndex = targetIndex;
  allLines.forEach(s=>s.classList.remove("active"));
  allLines[targetIndex].classList.add("active");
  const lineHeight = allLines[0].offsetHeight || 58;
  const boxHeight = document.querySelector(".lyric-container").offsetHeight || 460;
  const translateY = -(nowIndex * lineHeight) + boxHeight / 2 - lineHeight / 2;
  scrollBox.style.transform = `translateY(${translateY}px)`;
})
</script>
</body>
</html>
