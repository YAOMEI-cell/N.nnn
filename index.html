body{

.lyric-box{

  font-size:17px;
  line-height:2.6;

}
.line.active{

audio{

  margin-top:20px;

</head>

// 渲染全部歌词行
function renderLyric(){
  lyricBox.innerHTML = lyricList.map(item=>`<div class="line">${item.text}</div>`).join('');
}
renderLyric();

// 播放进度实时同步歌词滚动
audio.addEventListener('timeupdate', ()=>{
  const currentTime = audio.currentTime;
  let activeIndex = 0;

  // 匹配当前播放对应歌词行
  for(let i = 0; i < lyricList.length; i++){
    if(currentTime >= lyricList[i].time){
      activeIndex = i;
    }
  }

  // 清除全部高亮，激活当前行
  const allLines = lyricBox.querySelectorAll('.line');
  allLines.forEach(line => line.classList.remove('active'));
  if(allLines[activeIndex]) allLines[activeIndex].classList.add('active');

  // 滚动限位：底部歌词不会滚出可视框，最多向上滚动到倒数6行
  const maxScrollIndex = lyricList.length - 6;
  const scrollIndex = Math.min(activeIndex, maxScrollIndex);
  const lineHeight = 46;
  lyricBox.style.transform = `translateY(${-scrollIndex * lineHeight}px)`;
})
</script>
</body>
