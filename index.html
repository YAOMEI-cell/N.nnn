<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岁岁晚安</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#111;
            color:#fff;
            font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
            max-width:480px;
            margin:0 auto;
            padding:40px 20px;
            min-height:100vh;
        }
        .title{
            text-align:center;
            font-size:24px;
            color:#ff7788;
            margin-bottom:30px;
            font-weight:bold;
        }
        audio{
            width:100%;
            margin-bottom:30px;
        }
        .lyric-wrap{
            height:420px;
            overflow:hidden;
            position:relative;
        }
        .lyric-box{
            transition:transform 0.4s ease;
        }
        .line{
            text-align:center;
            font-size:17px;
            line-height:2.2;
            color:#888;
        }
        .line.active{
            color:#ff8899;
            font-size:19px;
        }
    </style>
</head>
<body>
    <div class="title">岁岁晚安</div>
    <audio controls id="audio">
        <source src="./song.m4a" type="audio/mp4">
        浏览器不支持音频
    

    <div class="lyric-wrap">
        <div class="lyric-box" id="lyricBox">
            <div class="line" data-time="0">一晃走过整整三年时间段</div>
            <div class="line" data-time="6">爱意从没掉进平淡的港湾</div>
            <div class="line" data-time="12">你惯着我孩子气所有小野蛮</div>
            <div class="line" data-time="18">包容软肋把我细心看管</div>
            <div class="line" data-time="24">命中敲定我们专属的羁绊</div>
            <div class="line" data-time="30">你中有我揉碎在三餐与晚安</div>

            <div class="line" data-time="36">黄金八月做彼此贴身挂件</div>
            <div class="line" data-time="42">每日温存与晚风漫漫</div>
            <div class="line" data-time="48">回家归途不忘榴莲搭配车厘子</div>
            <div class="line" data-time="54">揣着我偏爱奔赴我的心尖</div>

            <div class="line" data-time="60">晨起出门定格亲吻相拥片段</div>
            <div class="line" data-time="66">深夜小酌碰杯熬到凌晨时段</div>
            <div class="line" data-time="72">醉后依偎相拥等到天光漫上岸</div>
            <div class="line" data-time="78">三年晚安循环从未间断</div>

            <div class="line" data-time="84">拌嘴不过在乎催生的小牵绊</div>
            <div class="line" data-time="90">一眼释怀拥抱抹平所有不安</div>

            <div class="line" data-time="96">事事有回应 件件都有着落</div>
            <div class="line" data-time="102">你的偏爱日复一日不曾褪色</div>
            <div class="line" data-time="108">朝夕缠绕不分你我的轮廓</div>
            <div class="line" data-time="114">三年热恋依旧鲜活炙热</div>

            <div class="line" data-time="120">八月相伴贴身挂在你身侧</div>
            <div class="line" data-time="126">美酒长夜相拥熬过漫漫夜色</div>
            <div class="line" data-time="132">晨起吻别 睡前问候定格</div>
            <div class="line" data-time="138">命中注定只和你度过</div>

            <div class="line" data-time="144">琐碎日常你牢牢记下我的偏爱</div>
        </div>
    </div>

<script>
const audio=document.getElementById('audio');
const lyricBox=document.getElementById('lyricBox');
const lines=Array.from(document.querySelectorAll('.line'));

function findCurrentLine(time){
    for(let i=0;i<lines.length;i++){
        const t=Number(lines[i].dataset.time);
        const nextT=lines[i+1] ? Number(lines[i+1].dataset.time) : 9999;
        if(time>=t && time<nextT) return i;
    }
    return 0;
}

audio.addEventListener('timeupdate',()=>{
    const idx=findCurrentLine(audio.currentTime);
    lines.forEach(l=>l.classList.remove('active'));
    lines[idx].classList.add('active');
    lyricBox.style.transform=`translateY(${- idx * 44}px)`;
})
</script>
</body>
</html>
