<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岁岁晚安</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  position:relative;
}
.bg{
  position:absolute;inset:0;
  background:url("cover.JPG") center/cover no-repeat;
  opacity:0.25;
  z-index:-1;
}
.title{
  color:#ff4455;
  font-size:28px;
  margin-bottom:24px;
}
.lyric-wrap{
  width:90%;
  max-width:520px;
  height:320px;
  border:2px solid #777777;
  overflow:hidden;
  position:relative;
}
.lyric-box{
  transition:transform 0.5s ease;
  padding:120px 10px;
}
.line{
  text-align:center;
  font-size:17px;
  line-height:2.6;
  color:#aaa;
}
.line.active{
  color:#ff4455;
  font-size:20px;
}
audio{
  width:90%;
  max-width:500px;
  margin-top:20px;
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="title">岁岁晚安</div>
<div class="lyric-wrap">
  <div class="lyric-box" id="lyricBox"></div>
</div>
<audio id="audio" controls src="./song.m4a">

<script>
const audio = document.getElementById('audio');
const lyricBox = document.getElementById('lyricBox');

const lyricList = [
{"time":19.40,"text":"一晃走过整整三年时间段"},
{"time":23.20,"text":"爱意从没掉进平淡的港湾"},
{"time":26.80,"text":"你惯着我孩子气所有小野蛮"},
{"time":30.40,"text":"包容软肋把我细心看管"},
{"time":34.00,"text":"命中敲定我们专属的羁绊"},
{"time":37.60,"text":"你中有我揉碎在三餐与晚安"},
{"time":41.40,"text":"黄金八月做彼此贴身挂件"},
{"time":45.00,"text":"每日温存与晚风漫漫"},
{"time":48.60,"text":"回家归途不忘榴莲搭配车厘子"},
{"time":52.20,"text":"揣着我偏爱奔赴我的心尖"},
{"time":55.80,"text":"晨起出门定格亲吻相拥片段"},
{"time":59.40,"text":"深夜小酌碰杯熬到凌晨时段"},
{"time":63.00,"text":"醉后依偎相拥等到天光漫上岸"},
{"time":66.60,"text":"三年晚安循环从未间断"},
{"time":70.20,"text":"拌嘴不过在乎催生的小牵绊"},
{"time":73.80,"text":"一眼释怀拥抱抹平所有不安"},
{"time":77.60,"text":"事事有回应 件件都有着落"},
{"time":81.20,"text":"你的偏爱日复一日不曾褪色"},
{"time":84.80,"text":"朝夕缠绕不分你我的轮廓"},
{"time":88.40,"text":"三年热恋依旧鲜活炙热"},
{"time":92.00,"text":"八月相伴贴身挂在你身侧"},
{"time":95.60,"text":"美酒长夜相拥熬过漫漫夜色"},
{"time":99.20,"text":"晨起吻别 睡前问候定格"},
{"time":102.80,"text":"命中注定只和你度过"},
{"time":106.40,"text":"琐碎日常你牢牢记下我的偏爱"}
];

function renderLyric(){
  lyricBox.innerHTML = lyricList.map(item=>`<div class="line">${item.text}</div>`).join('');
}
renderLyric();

audio.addEventListener('timeupdate',()=>{
  let t = audio.currentTime;
  let idx = 0;
  for(let i=0;i<lyricList.length;i++){
    if(t >= lyricList[i].time) idx = i;
  }
  const lineDom = lyricBox.querySelectorAll('.line');
  lineDom.forEach(d=>d.classList.remove('active'));
  if(lineDom[idx]) lineDom[idx].classList.add('active');
  const maxOffset = Math.max(0, lyricList.length - 6);
  const move = Math.min(idx,maxOffset);
  lyricBox.style.transform = `translateY(${-move * 44}px)`;
})
</script>
</body>
</html>
