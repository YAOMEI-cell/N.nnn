<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岁岁晚安</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:url("./cover.JPG") center center no-repeat;
  background-size:cover;
  background-attachment:fixed;
  min-height:100vh;
  font-family:"PingFang SC",system-ui,sans-serif;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:80px;
  padding-left:20px;
  padding-right:20px;
}
.dark-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.54);
  z-index:0;
}
audio{
  width:100%;
  max-width:440px;
  z-index:2;
  position:relative;
  margin-bottom:40px;
}
.lyric-container{
  width:100%;
  max-width:440px;
  height:460px;
  overflow:hidden;
  position:relative;
  z-index:2;
}
.lyric-scroll{
  transition:transform 0.5s ease-out;
}
.lyric-line{
  text-align:center;
  padding:18px 12px;
  font-size:18px;
  line-height:1.75;
  color:#cccccc;
}
.lyric-line.active{
  color:#ffffff;
  font-size:21px;
  font-weight:500;
}
</style>
</head>
<body>
<div class="dark-mask"></div>
<audio id="player" controls src="./song.m4a" />

<div class="lyric-container">
  <div class="lyric-scroll" id="scrollBox"></div>
</div>

<script>
const lyricData = [
{"time":0,"text":""},
{"time":6.18,"text":"一晃走过整整三年时间段"},
{"time":9.57,"text":"爱意从没掉进平淡的港湾"},
{"time":13.04,"text":"你惯着我孩子气所有小野蛮"},
{"time":16.47,"text":"包容软肋把我细心看管"},
{"time":19.93,"text":"命中敲定我们专属的羁绊"},
{"time":23.36,"text":"你中有我揉碎在三餐与晚安"},
{"time":26.89,"text":"黄金八月做彼此贴身挂件"},
{"time":30.31,"text":"每日温存与晚风漫漫"},
{"time":33.78,"text":"回家归途不忘榴莲搭配车厘子"},
{"time":37.21,"text":"揣着我偏爱奔赴我的心尖"},
{"time":40.74,"text":"晨起出门定格亲吻相拥片段"},
{"time":44.17,"text":"深夜小酌碰杯熬到凌晨时段"},
{"time":47.64,"text":"醉后依偎相拥等到天光漫上岸"},
{"time":51.06,"text":"三年晚安循环从未间断"},
{"time":54.59,"text":"拌嘴不过在乎催生的小牵绊"},
{"time":58.02,"text":"一眼释怀拥抱抹平所有不安"},
{"time":61.55,"text":"事事有回应 件件都有着落"},
{"time":64.98,"text":"你的偏爱日复一日不曾褪色"},
{"time":68.45,"text":"朝夕缠绕不分你我的轮廓"},
{"time":71.88,"text":"三年热恋依旧鲜活炙热"},
{"time":75.41,"text":"八月相伴贴身挂在你身侧"},
{"time":78.84,"text":"美酒长夜相拥熬过漫漫夜色"},
{"time":82.31,"text":"晨起吻别 睡前问候定格"},
{"time":85.74,"text":"命中注定只和你度过"},
{"time":89.27,"text":"琐碎日常你牢牢记下我的偏爱"}
];

document.addEventListener('DOMContentLoaded',function(){
  const player = document.getElementById("player");
  const scrollBox = document.getElementById("scrollBox");

  lyricData.forEach(row=>{
    const div = document.createElement("div");
    div.className = "lyric-line";
    div.innerText = row.text;
    scrollBox.appendChild(div);
  })

  const allLines = document.querySelectorAll(".lyric-line");
  let nowIndex = -1;

  player.addEventListener("timeupdate",function(){
    const currentTime = player.currentTime;
    let targetIndex = 0;
    for(let i=0;i<lyricData.length;i++){
      if(currentTime >= lyricData[i].time){
        targetIndex = i;
      }
    }
    if(targetIndex === nowIndex) return;
    nowIndex = targetIndex;

    allLines.forEach(item=>item.classList.remove("active"));
    allLines[targetIndex].classList.add("active");

    const lineHeight = allLines[0].offsetHeight || 58;
    const boxHeight = document.querySelector(".lyric-container").offsetHeight || 460;
    const translateY = -(nowIndex * lineHeight) + boxHeight / 2 - lineHeight / 2;
    scrollBox.style.transform = `translateY(${translateY}px)`;
  })
})
</script>
</body>
</html>
